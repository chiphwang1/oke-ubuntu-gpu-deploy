{
  "title": "Ubuntu GPU certification on OKE",
  "description": "Enhanced OKE with non-HPC Ubuntu GPU workers. GPU add-on removal is enforced; live validation is required.",
  "schemaVersion": "1.1.0",
  "version": "1.0.6",
  "locale": "en",
  "variableGroups": [
    {
      "title": "Identity",
      "variables": [
        "tenancy_ocid",
        "compartment_ocid",
        "region",
        "auth",
        "config_file_profile"
      ]
    },
    {
      "title": "Deployment",
      "variables": [
        "deployment_mode",
        "cluster_name",
        "existing_cluster_id",
        "network_compartment_ocid",
        "existing_vcn_id",
        "existing_worker_subnet_id",
        "existing_pod_subnet_id",
        "existing_endpoint_subnet_id",
        "existing_lb_subnet_id"
      ]
    },
    {
      "title": "Cluster",
      "variables": [
        "kubernetes_version",
        "public_api_endpoint"
      ]
    },
    {
      "title": "Network",
      "variables": [
        "vcn_cidr",
        "pods_cidr",
        "services_cidr",
        "cni_type",
        "max_pods_per_node"
      ]
    },
    {
      "title": "SSH access \u2014 GPU and CPU workers",
      "variables": [
        "ssh_key_source",
        "ssh_public_key"
      ]
    },
    {
      "title": "Workers",
      "variables": [
        "node_pool_name",
        "ubuntu_version",
        "image_mode",
        "ubuntu_image_id",
        "availability_domains",
        "node_shape",
        "node_count",
        "fault_domains",
        "boot_volume_size_gbs",
        "customize_node_labels",
        "node_labels",
        "node_ocpus",
        "node_memory_gbs"
      ]
    },
    {
      "title": "Tags",
      "variables": [
        "freeform_tags"
      ]
    },
    {
      "title": "Optional public CPU diagnostic pool",
      "variables": [
        "create_public_cpu_pool",
        "cpu_node_shape",
        "cpu_node_ocpus",
        "cpu_node_memory_gbs",
        "cpu_node_count",
        "cpu_availability_domain",
        "cpu_subnet_cidr",
        "cpu_internet_gateway_id"
      ]
    }
  ],
  "variables": {
    "tenancy_ocid": {
      "title": "Tenancy Ocid",
      "description": "Tenancy OCID.",
      "type": "string",
      "required": true,
      "visible": false
    },
    "compartment_ocid": {
      "title": "Compartment Ocid",
      "description": "Compartment for new resources.",
      "type": "oci:identity:compartment:id",
      "required": true
    },
    "region": {
      "title": "Region",
      "description": "Defaults to the current OCI Console region; select another region if needed.",
      "type": "oci:identity:region:name",
      "required": true
    },
    "auth": {
      "title": "Auth",
      "description": "InstancePrincipal for ORM with its injected delegation token.",
      "type": "enum",
      "required": false,
      "default": "InstancePrincipal",
      "enum": [
        "ResourcePrincipal",
        "SecurityToken",
        "APIKey",
        "InstancePrincipal"
      ],
      "visible": false
    },
    "config_file_profile": {
      "title": "Config File Profile",
      "description": "OCI CLI/profile name for local execution.",
      "type": "string",
      "required": false,
      "default": "DEFAULT",
      "visible": false
    },
    "deployment_mode": {
      "title": "Deployment Mode",
      "description": "Create everything, use an existing VCN, or join an existing OKE cluster.",
      "type": "enum",
      "required": false,
      "default": "new_infrastructure",
      "enum": [
        "new_infrastructure",
        "existing_vcn",
        "existing_cluster"
      ]
    },
    "cluster_name": {
      "title": "Cluster Name",
      "description": "Name prefix for new resources.",
      "type": "string",
      "required": false,
      "default": "oke-ubuntu-gpu"
    },
    "existing_cluster_id": {
      "title": "Existing Cluster Id",
      "description": "Existing Enhanced OKE cluster OCID (existing_cluster mode).",
      "type": "oci:container:cluster:id",
      "required": false,
      "default": "",
      "visible": {
        "eq": [
          "${deployment_mode}",
          "existing_cluster"
        ]
      },
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      }
    },
    "existing_vcn_id": {
      "title": "Existing Vcn Id",
      "description": "Select a VCN in the network compartment and current Console region. For cluster reuse, select the cluster VCN.",
      "type": "oci:core:vcn:id",
      "required": true,
      "dependsOn": {
        "compartmentId": "${network_compartment_ocid}"
      },
      "visible": {
        "not": [
          {
            "eq": [
              "${deployment_mode}",
              "new_infrastructure"
            ]
          }
        ]
      }
    },
    "existing_worker_subnet_id": {
      "title": "Existing Worker Subnet Id",
      "description": "Existing private regional worker subnet in the selected VCN.",
      "type": "oci:core:subnet:id",
      "required": true,
      "visible": {
        "not": [
          {
            "eq": [
              "${deployment_mode}",
              "new_infrastructure"
            ]
          }
        ]
      },
      "dependsOn": {
        "compartmentId": "${network_compartment_ocid}",
        "vcnId": "${existing_vcn_id}",
        "hidePublicSubnet": true
      }
    },
    "existing_endpoint_subnet_id": {
      "title": "Existing Endpoint Subnet Id",
      "description": "Endpoint subnet for a new cluster in an existing VCN.",
      "type": "oci:core:subnet:id",
      "required": true,
      "visible": {
        "eq": [
          "${deployment_mode}",
          "existing_vcn"
        ]
      },
      "dependsOn": {
        "compartmentId": "${network_compartment_ocid}",
        "vcnId": "${existing_vcn_id}"
      }
    },
    "existing_lb_subnet_id": {
      "title": "Existing Lb Subnet Id",
      "description": "Load-balancer subnet for a new cluster in an existing VCN.",
      "type": "oci:core:subnet:id",
      "required": true,
      "visible": {
        "eq": [
          "${deployment_mode}",
          "existing_vcn"
        ]
      },
      "dependsOn": {
        "compartmentId": "${network_compartment_ocid}",
        "vcnId": "${existing_vcn_id}"
      }
    },
    "kubernetes_version": {
      "title": "Kubernetes Version",
      "description": "Exact regional OKE version; for reuse, must equal existing cluster version.",
      "type": "oci:kubernetes:versions:id",
      "required": false,
      "default": "v1.36.4",
      "dependsOn": {
        "compartmentId": "${compartment_ocid}",
        "clusterOptionId": "all"
      }
    },
    "public_api_endpoint": {
      "title": "Public Api Endpoint",
      "description": "Give a new cluster a public API IP. TCP 6443 allows all IPv4 sources; Kubernetes authentication is required.",
      "type": "boolean",
      "required": false,
      "default": true,
      "visible": false
    },
    "vcn_cidr": {
      "title": "Vcn Cidr",
      "description": "Automatic /16 VCN with /24 API, LB and node subnets and a /22 native pod subnet.",
      "type": "string",
      "required": false,
      "default": "10.16.0.0/16",
      "visible": false
    },
    "pods_cidr": {
      "title": "Pods Cidr",
      "description": "Flannel overlay pod CIDR for new clusters.",
      "type": "string",
      "required": false,
      "default": "10.244.0.0/16",
      "visible": false
    },
    "services_cidr": {
      "title": "Services Cidr",
      "description": "Kubernetes service CIDR for new clusters.",
      "type": "string",
      "required": false,
      "default": "10.96.0.0/16",
      "visible": false
    },
    "ubuntu_version": {
      "title": "Ubuntu Version",
      "description": "Ubuntu release; selects the matching Oracle Ubuntu bootstrap repository.",
      "type": "enum",
      "required": false,
      "default": "24.04",
      "enum": [
        "22.04",
        "24.04"
      ]
    },
    "image_mode": {
      "title": "Image Mode",
      "description": "Build a clean custom image, or use an existing clean custom Ubuntu image.",
      "type": "enum",
      "required": false,
      "default": "create",
      "enum": [
        "create",
        "existing"
      ]
    },
    "ubuntu_image_id": {
      "title": "Ubuntu Image Id",
      "description": "Custom Ubuntu image OCID when image_mode is existing.",
      "type": "oci:core:image:id",
      "required": false,
      "default": "",
      "visible": {
        "eq": [
          "${image_mode}",
          "existing"
        ]
      },
      "dependsOn": {
        "compartmentId": "${compartment_ocid}",
        "shape": "${node_shape}",
        "operatingSystemVersion": "${ubuntu_version}"
      }
    },
    "source_ubuntu_image_id": {
      "title": "Source Ubuntu Image Id",
      "description": "Optional standard x86 Ubuntu source image; empty discovers newest matching image.",
      "type": "oci:core:image:id",
      "required": false,
      "default": "",
      "visible": false,
      "dependsOn": {
        "compartmentId": "${compartment_ocid}",
        "shape": "${builder_shape}",
        "operatingSystemVersion": "${ubuntu_version}"
      }
    },
    "node_shape": {
      "title": "Node Shape",
      "description": "Select a regional NVIDIA GPU shape supported in every selected availability domain. No HPC/RDMA configuration is deployed.",
      "type": "oci:core:instanceshape:name",
      "required": true,
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      },
      "pattern": "^(VM|BM)\\.GPU"
    },
    "node_count": {
      "title": "Node Count",
      "description": "Fixed worker-node count.",
      "type": "number",
      "required": false,
      "default": 1
    },
    "availability_domain": {
      "type": "string",
      "visible": false,
      "default": ""
    },
    "fault_domains": {
      "type": "enum",
      "title": "Fault domains",
      "description": "Select one or more fault domains for every selected AD. Leave empty to let OKE choose.",
      "enum": [
        "FAULT-DOMAIN-1",
        "FAULT-DOMAIN-2",
        "FAULT-DOMAIN-3"
      ],
      "allowMultiple": true,
      "additionalProps": {
        "allowMultiple": true
      },
      "required": false
    },
    "boot_volume_size_gbs": {
      "title": "Boot Volume Size Gbs",
      "description": "Worker boot volume size in GB, at least 50 and at least image minimum.",
      "type": "number",
      "required": false,
      "default": 100
    },
    "ssh_public_key": {
      "title": "Shared worker SSH public key",
      "description": "Upload or paste one public key for both GPU and CPU node pools. Keep the matching private key on your computer.",
      "type": "oci:core:ssh:publickey",
      "required": false,
      "default": "",
      "additionalProps": {
        "allowMultiple": false
      },
      "visible": {
        "eq": [
          "${ssh_key_source}",
          "existing"
        ]
      }
    },
    "node_labels": {
      "title": "Node Labels",
      "description": "Additional Kubernetes labels applied to the Ubuntu workers.",
      "type": "map",
      "required": false,
      "default": "{}",
      "valueType": "map_string_value",
      "visible": "${customize_node_labels}"
    },
    "node_ocpus": {
      "title": "Node Ocpus",
      "description": "OCPU count only for a selectable flexible GPU shape; null otherwise.",
      "type": "number",
      "required": false,
      "visible": false
    },
    "node_memory_gbs": {
      "title": "Node Memory Gbs",
      "description": "Memory GB only for a selectable flexible GPU shape; null otherwise.",
      "type": "number",
      "required": false,
      "visible": false
    },
    "builder_shape": {
      "title": "Builder Shape",
      "description": "Non-GPU x86 Flex shape for the temporary image-source instance.",
      "type": "string",
      "required": false,
      "default": "VM.Standard.E4.Flex",
      "visible": false
    },
    "builder_ocpus": {
      "title": "Builder Ocpus",
      "description": "Image-builder OCPUs.",
      "type": "number",
      "required": false,
      "default": 1,
      "visible": false
    },
    "builder_memory_gbs": {
      "title": "Builder Memory Gbs",
      "description": "Image-builder memory in GB.",
      "type": "number",
      "required": false,
      "default": 8,
      "visible": false
    },
    "freeform_tags": {
      "title": "Freeform Tags",
      "description": "OCI freeform tags on resources created by this stack.",
      "type": "map",
      "required": false,
      "default": "{\"purpose\": \"nvidia-gpu-operator-certification\"}",
      "valueType": "map_string_value"
    },
    "cni_type": {
      "title": "Pod networking",
      "type": "enum",
      "enum": [
        "FLANNEL_OVERLAY",
        "OCI_VCN_IP_NATIVE"
      ],
      "default": "OCI_VCN_IP_NATIVE",
      "visible": false
    },
    "max_pods_per_node": {
      "title": "Maximum native pods per node",
      "type": "integer",
      "default": 31,
      "minimum": 1,
      "maximum": 110,
      "visible": {
        "eq": [
          "${cni_type}",
          "OCI_VCN_IP_NATIVE"
        ]
      }
    },
    "node_pool_name": {
      "type": "string",
      "title": "Node pool name",
      "description": "Optional, maximum 32 characters. Empty derives a length-safe name from the cluster name.",
      "default": "",
      "maxLength": 32
    },
    "builder_availability_domain": {
      "title": "Image Builder Availability Domain",
      "description": "Optional separate AD for the image-source VM. Pin its existing AD when moving workers to preserve the source VM.",
      "type": "oci:identity:availabilitydomain:name",
      "required": false,
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      },
      "visible": false,
      "default": ""
    },
    "create_public_cpu_pool": {
      "type": "boolean",
      "title": "Add public CPU pool",
      "default": false,
      "description": "Add an SSH-accessible Ubuntu CPU pool without replacing the GPU pool. Requires this stack to manage the cluster."
    },
    "cpu_node_shape": {
      "title": "CPU shape",
      "type": "oci:core:instanceshape:name",
      "default": "VM.Standard.E4.Flex",
      "visible": "${create_public_cpu_pool}",
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      },
      "pattern": "^VM\\.Standard\\.(E[3-9]|3)\\.Flex$"
    },
    "cpu_node_ocpus": {
      "title": "CPU OCPUs",
      "type": "number",
      "default": 2,
      "visible": "${create_public_cpu_pool}"
    },
    "cpu_node_memory_gbs": {
      "title": "CPU memory (GB)",
      "type": "number",
      "default": 16,
      "visible": "${create_public_cpu_pool}"
    },
    "cpu_node_count": {
      "title": "CPU node count",
      "type": "number",
      "default": 1,
      "visible": "${create_public_cpu_pool}"
    },
    "cpu_subnet_cidr": {
      "title": "Public CPU subnet CIDR",
      "type": "string",
      "default": "10.16.3.0/24",
      "visible": false
    },
    "cpu_internet_gateway_id": {
      "title": "Existing internet gateway OCID",
      "type": "string",
      "default": "",
      "visible": {
        "and": [
          "${create_public_cpu_pool}",
          {
            "eq": [
              "${deployment_mode}",
              "existing_vcn"
            ]
          }
        ]
      },
      "required": true,
      "description": "Used only for the public CPU subnet in a reused VCN. New infrastructure creates its internet gateway automatically."
    },
    "cpu_availability_domain": {
      "title": "CPU availability domain",
      "type": "oci:identity:availabilitydomain:name",
      "required": false,
      "visible": "${create_public_cpu_pool}",
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      }
    },
    "map_string_value": {
      "type": "string",
      "visible": false
    },
    "network_compartment_ocid": {
      "type": "oci:identity:compartment:id",
      "title": "Network compartment",
      "description": "Select the compartment containing the existing VCN and subnets. It may differ from the stack compartment.",
      "required": true,
      "visible": {
        "not": [
          {
            "eq": [
              "${deployment_mode}",
              "new_infrastructure"
            ]
          }
        ]
      }
    },
    "availability_domains": {
      "type": "enum",
      "title": "Availability domains",
      "description": "Select AD-1, AD-2, or AD-3. Terraform resolves the full tenancy-specific names. Single-AD regions support AD-1 only; Plan rejects unavailable ADs.",
      "required": true,
      "enum": [
        "AD-1",
        "AD-2",
        "AD-3"
      ],
      "allowMultiple": true,
      "additionalProps": {
        "allowMultiple": true
      }
    },
    "existing_pod_subnet_id": {
      "title": "Existing Pod Subnet",
      "description": "Select a private regional subnet for VCN-native pod addresses.",
      "type": "oci:core:subnet:id",
      "required": true,
      "visible": {
        "not": [
          {
            "eq": [
              "${deployment_mode}",
              "new_infrastructure"
            ]
          }
        ]
      },
      "dependsOn": {
        "compartmentId": "${network_compartment_ocid}",
        "vcnId": "${existing_vcn_id}",
        "hidePublicSubnet": true
      }
    },
    "customize_node_labels": {
      "type": "boolean",
      "title": "Add custom node labels",
      "default": false,
      "required": false,
      "description": "Optional. Enable only if you want additional Kubernetes node labels."
    },
    "ssh_key_source": {
      "type": "enum",
      "title": "SSH key option for both node pools",
      "description": "generate: create one key pair during Apply and download it afterward. existing: upload a .pub file or paste a public key. Both GPU and CPU workers use this same key.",
      "enum": [
        "generate",
        "existing"
      ],
      "default": "existing",
      "required": true
    }
  },
  "informationalText": "New infrastructure uses VCN 10.16.0.0/16: public API 10.16.0.0/24, load balancers 10.16.1.0/24, nodes 10.16.2.0/24 and private VCN-native pods 10.16.4.0/22. TCP 6443 allows all IPv4 sources. The image builder uses VM.Standard.E4.Flex with 1 OCPU and 8 GB RAM automatically.",
  "outputs": {
    "generated_worker_ssh_private_key": {
      "type": "copyableString",
      "title": "Shared GPU and CPU private key \u2014 save as a file",
      "sensitive": true
    }
  }
}
